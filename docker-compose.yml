services:
  mysql:
    image: mysql:8.0
    container_name: oms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-oms_db}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_CHARACTER_SET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-oms_db}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MESSENGER_VERIFY_TOKEN: ${MESSENGER_VERIFY_TOKEN:-}
      MESSENGER_APP_SECRET: ${MESSENGER_APP_SECRET:-}
      MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
      MESSENGER_DEFAULT_SHOP_ID: ${MESSENGER_DEFAULT_SHOP_ID:-0}
      MESSENGER_PAGE_ACCESS_TOKEN: ${MESSENGER_PAGE_ACCESS_TOKEN:-}
      MESSENGER_OUTBOUND_RETRY_INTERVAL_MS: ${MESSENGER_OUTBOUND_RETRY_INTERVAL_MS:-30000}
      PUBLIC_FRONTEND_BASE_URL: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:4200}
      PUBLIC_ORDER_TRACKING_SECRET: ${PUBLIC_ORDER_TRACKING_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      PAYOS_ENABLED: ${PAYOS_ENABLED:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYMENT_CANCEL_MINUTES: ${PAYMENT_CANCEL_MINUTES:-30}
      PAYMENT_REMINDER_MINUTES: ${PAYMENT_REMINDER_MINUTES:-25}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-false}
      RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-20}
      RATE_LIMIT_PUBLIC_MAX_REQUESTS: ${RATE_LIMIT_PUBLIC_MAX_REQUESTS:-120}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - oms_uploads:/app/uploads
      - oms_logs:/app/logs
    networks:
      - oms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "4200:80"
    networks:
      - oms-network

volumes:
  mysql_data:
    driver: local
  oms_uploads:
    driver: local
  oms_logs:
    driver: local

networks:
  oms-network:
    driver: bridge
