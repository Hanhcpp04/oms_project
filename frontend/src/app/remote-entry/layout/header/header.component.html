<header
  class="flex h-[60px] shrink-0 items-center justify-between bg-white px-4" style="box-shadow: 0px -1px 0px 0px #E5E5E5 inset;">
  <div class="flex items-center gap-2">
    <!-- Mobile menu toggle -->
    <button
      class="flex h-8 w-8 items-center justify-center rounded-[8px] text-[#707072] transition hover:bg-[#F5F5F5] lg:hidden"
      (click)="toggleMobileSidebar.emit()" aria-label="Toggle mobile navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <!-- Desktop sidebar toggle -->
    <button
      class="hidden h-8 w-8 items-center justify-center rounded-[8px] text-[#707072] transition hover:bg-[#F5F5F5] lg:flex"
      (click)="toggleSidebar.emit()" aria-label="Collapse sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <line x1="9" y1="3" x2="9" y2="21" />
      </svg>
    </button>

    <div class="hidden items-center gap-2 sm:flex">
      <div class="h-5 w-px bg-[#E5E5E5]"></div>
      <h1 class="m-0 text-sm font-medium text-[#111111]">Order Management System</h1>
    </div>
  </div>

  <div class="flex items-center gap-1.5">
    <!-- Notifications -->
    <button
      class="relative flex h-8 w-8 items-center justify-center rounded-[8px] text-[#707072] transition hover:bg-[#F5F5F5]"
      aria-label="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-[#111111] animate-pulse-dot"></span>
    </button>

    <!-- User info -->
    <div class="hidden items-center gap-2.5 border-l border-[#E5E5E5] pl-3 md:flex">
      <div
        class="flex h-8 w-8 items-center justify-center rounded-full bg-[#111111] text-xs font-medium text-white">
        {{ currentUserName.charAt(0) }}
      </div>
      <div class="text-right">
        <p class="m-0 text-xs font-medium text-[#111111]">{{ currentUserName }}</p>
        <p class="m-0 text-[10px] text-[#9E9EA0]">{{ currentShopName }}</p>
      </div>
      <button
        class="flex h-8 items-center justify-center rounded-[8px] px-2.5 text-xs font-medium text-[#707072] transition hover:bg-[#FFE5E5] hover:text-[#D30005]"
        (click)="logout.emit()" aria-label="Đăng xuất">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16,17 21,12 16,7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>
</header>
