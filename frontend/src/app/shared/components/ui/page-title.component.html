<section class="mb-5 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h2 class="m-0 mt-0.5 text-xl font-medium text-[#111111]">{{ title }}</h2>
    <p class="mt-1 text-sm text-[#707072]" *ngIf="description">{{ description }}</p>
  </div>

  <app-ui-button *ngIf="actionLabel" variant="primary" size="sm" (clicked)="action.emit()">
    {{ actionLabel }}
  </app-ui-button>
</section>
