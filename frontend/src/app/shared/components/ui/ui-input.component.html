<div [class]="wrapperClasses">
  @if (label) {
    <label [for]="resolvedId" class="text-[11px] font-medium uppercase tracking-[0.08em] text-[var(--color-text-tertiary)]">
      {{ label }}
    </label>
  }

  <div [class]="shellClasses">
    <input
      [id]="resolvedId"
      [name]="name || null"
      [type]="inputTypeAttr"
      [placeholder]="placeholder"
      [value]="displayValue"
      [autocomplete]="autocomplete"
      [attr.inputmode]="inputModeAttr"
      [readonly]="readonly"
      [required]="required"
      [disabled]="disabled"
      [class]="inputClasses"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (blur)="onBlur()"
    />

    @if (suffixText) {
      <span class="pr-3 text-xs font-medium text-[var(--color-text-tertiary)]">{{ suffixText }}</span>
    }
  </div>

  @if (hasError) {
    <p class="m-0 text-xs font-medium text-[var(--color-danger-text)]">{{ errorText }}</p>
  } @else if (helperText) {
    <p class="m-0 text-xs text-[var(--color-text-muted)]">{{ helperText }}</p>
  }
</div>
