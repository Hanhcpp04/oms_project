<section class="flex min-h-[80vh] items-center justify-center">
  <div class="w-full max-w-md">
    <div class="border border-[#E5E5E5] bg-white p-6 md:p-8">
      <div class="flex justify-center">
        <div class="inline-flex h-12 w-12 items-center justify-center rounded-[8px] bg-[#111111] text-white">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </div>
      </div>

      <h1 class="mt-4 text-center text-xl font-medium text-[#111111]">Đăng nhập vào OMS</h1>
      <p class="mt-1 text-center text-sm text-[#707072]">Truy cập hệ thống quản lý đơn hàng</p>

      <form class="mt-6 grid gap-4" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <label class="grid gap-1.5">
          <span class="text-xs font-medium text-[#707072]">Tên tài khoản hoặc email</span>
          <input
            type="text"
            placeholder="Nhập tên tài khoản hoặc email"
            formControlName="identifier"
            autocomplete="username"
            class="h-10 rounded-[8px] border border-[#CACACB] bg-[#F5F5F5] px-3 text-sm text-[#111111] placeholder:text-[#A3A3A3] outline-none transition focus:border-[#111111] focus:ring-2 focus:ring-[rgba(39,93,197,0.15)]"
            [class.border-red-400]="identifierError()"
            [attr.aria-invalid]="identifierError() ? 'true' : 'false'"
          />
          @if (identifierError(); as error) {
            <p class="m-0 text-xs font-medium text-[#D30005]">{{ error }}</p>
          }
        </label>

        <label class="grid gap-1.5">
          <span class="text-xs font-medium text-[#707072]">Mật khẩu</span>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Nhập mật khẩu"
              formControlName="password"
              autocomplete="current-password"
              class="h-10 w-full rounded-[8px] border border-[#CACACB] bg-[#F5F5F5] px-3 pr-10 text-sm text-[#111111] placeholder:text-[#A3A3A3] outline-none transition focus:border-[#111111] focus:ring-2 focus:ring-[rgba(39,93,197,0.15)]"
              [class.border-red-400]="passwordError()"
              [attr.aria-invalid]="passwordError() ? 'true' : 'false'"
            />
            <button
              type="button"
              class="absolute right-2 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-full text-[#707072] transition hover:bg-[#E5E5E5] hover:text-[#111111]"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
              [attr.title]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
              (click)="showPassword = !showPassword"
            >
              @if (showPassword) {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C7 20 2.73 16.89 1 12a11.75 11.75 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A10.81 10.81 0 0 1 12 4c5 0 9.27 3.11 11 8a11.8 11.8 0 0 1-2.06 3.19" />
                  <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88" />
                  <path d="M1 1l22 22" />
                </svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
          @if (passwordError(); as error) {
            <p class="m-0 text-xs font-medium text-[#D30005]">{{ error }}</p>
          }
        </label>

        <button
          type="submit"
          [disabled]="submitting()"
          class="mt-1 flex h-10 w-full cursor-pointer items-center justify-center rounded-[30px] bg-[#111111] text-sm font-medium text-white transition hover:bg-[#707072] disabled:cursor-not-allowed disabled:bg-[#707072]"
        >
          {{ submitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
        </button>
      </form>

      <div class="mt-5 flex items-center gap-3">
        <div class="h-px flex-1 bg-[#E5E5E5]"></div>
        <span class="text-xs text-[#9E9EA0]">hoặc</span>
        <div class="h-px flex-1 bg-[#E5E5E5]"></div>
      </div>

      <div class="mt-4 flex min-h-10 w-full justify-center border border-transparent">
        <div #googleBtn class="w-full"></div>
      </div>
    </div>

    <p class="mt-4 text-center text-sm text-[#707072]">
      Chưa có tài khoản?
      <a routerLink="/register" class="font-medium text-[#1151FF] no-underline hover:underline">
        Đăng ký ngay
      </a>
    </p>
  </div>
</section>
