<section>
  <div class="mb-3 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h2 class="m-0 text-sm font-semibold text-[var(--color-text-primary)]">Tồn kho</h2>
      <p class="m-0 mt-1 text-xs text-[var(--color-text-secondary)]">Tổng hợp tồn kho theo biến thể.</p>
    </div>
    <span class="text-xs font-semibold text-[var(--color-text-secondary)]">{{ stockPercent }}% biến thể còn hàng</span>
  </div>

  <div class="grid border-y border-[var(--color-border)] sm:grid-cols-2 xl:grid-cols-4">
    <div class="border-b border-[var(--color-border)] py-3 pr-4 sm:border-r xl:border-b-0">
      <p class="m-0 text-xs font-semibold uppercase tracking-[0] text-[var(--color-text-muted)]">Tổng tồn</p>
      <p class="m-0 mt-1 text-xl font-semibold text-[var(--color-text-primary)]">{{ totalStock }}</p>
    </div>
    <div class="border-b border-[var(--color-border)] py-3 pr-4 sm:border-b-0 sm:border-r sm:pl-4">
      <p class="m-0 text-xs font-semibold uppercase tracking-[0] text-[var(--color-text-muted)]">Biến thể còn hàng</p>
      <p class="m-0 mt-1 text-xl font-semibold text-[var(--color-text-primary)]">{{ availableVariants }}</p>
    </div>
    <div class="border-b border-[var(--color-border)] py-3 pr-4 sm:border-r sm:pl-4 xl:border-b-0">
      <p class="m-0 text-xs font-semibold uppercase tracking-[0] text-[var(--color-warning-text)]">Sắp hết</p>
      <p class="m-0 mt-1 text-xl font-semibold text-[var(--color-warning-text)]">{{ lowStockCount }}</p>
    </div>
    <div class="py-3 sm:pl-4">
      <p class="m-0 text-xs font-semibold uppercase tracking-[0] text-[var(--color-danger-text)]">Hết hàng</p>
      <p class="m-0 mt-1 text-xl font-semibold text-[var(--color-danger-text)]">{{ outOfStockCount }}</p>
    </div>
  </div>

  <div class="mt-3 h-1 overflow-hidden rounded-none bg-[var(--color-surface-tertiary)]">
    <div class="h-full rounded-none bg-[var(--color-accent)]" [style.width.%]="stockPercent"></div>
  </div>
</section>
