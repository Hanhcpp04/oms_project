<!-- Top Header: Back & Save -->
<div class="mx-auto mt-6 max-w-[770px] flex items-center justify-between">

  <div class="flex items-center gap-3">
    <a [routerLink]="getPublicFormLink()" target="_blank"
      class="inline-flex h-8 items-center gap-1.5 rounded-[var(--radius-sm)] px-2 text-xs font-semibold text-[var(--color-accent)] no-underline transition hover:bg-[var(--color-accent-soft)] relative z-10 cursor-pointer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
      Mở biểu mẫu
    </a>

    <button (click)="openSaveModal()"
      class="rounded shadow-sm bg-[#673ab7] px-4 py-2 text-sm font-medium text-white transition hover:bg-[#5e35b1]">
      Lưu biểu mẫu
    </button>
  </div>
</div>

<!-- Wrapper for Google Forms layout -->
<div class="relative mx-auto mt-4 max-w-[770px] pb-24 lg:pb-10"> @if (selectedTemplate(); as tmpl) {

  <!-- Floating toolbar (Right side on desktop, fixed bottom on mobile) -->
  <div
    class="fixed bottom-4 left-0 right-0 z-10 flex justify-center lg:absolute lg:-right-16 lg:bottom-auto lg:left-auto lg:top-0 lg:block lg:h-full lg:w-12 lg:justify-start">
    <div
      class="flex items-center gap-1 rounded-full border border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-2 shadow-[var(--shadow-lg)] lg:sticky lg:top-24 lg:flex-col lg:rounded-xl lg:px-2 lg:py-3">
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-secondary)] transition hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text-primary)]"
        title="Thêm câu hỏi (Văn bản)" (click)="addQuickField('text')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-tertiary)] transition hover:bg-[var(--color-surface-hover)]"
        title="Thêm trắc nghiệm" (click)="addQuickField('single_choice')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-tertiary)] transition hover:bg-[var(--color-surface-hover)]"
        title="Thêm checkbox" (click)="addQuickField('multi_choice')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <polyline points="9 11 12 14 22 4" />
        </svg>
      </button>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-tertiary)] transition hover:bg-[var(--color-surface-hover)]"
        title="Thêm upload ảnh" (click)="addQuickField('image')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
      </button>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-tertiary)] transition hover:bg-[var(--color-surface-hover)]"
        title="Thêm đoạn văn" (click)="addQuickField('textarea')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="15" y2="12" />
          <line x1="3" y1="18" x2="18" y2="18" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Form banner -->
  <div class="gform-banner mb-3 shadow-[var(--shadow-sm)] cursor-pointer transition-all duration-200 relative"
    [class.border-l-4]="activeFieldId === 'HEADER'" [class.border-l-[var(--color-accent)]]="activeFieldId === 'HEADER'"
    [class.rounded-l-none]="activeFieldId === 'HEADER'" (click)="activeFieldId = 'HEADER'">

    <!-- Border top active color -->
    <div class="absolute left-0 right-0 top-0 h-2.5 rounded-t-[var(--radius-lg)] bg-[var(--color-accent)]"></div>

    <div class="pt-4">
      <input
        class="m-0 w-full border-0 border-b border-transparent bg-transparent p-0 text-3xl font-regular text-[var(--color-text-primary)] outline-none transition hover:border-[var(--color-border)] focus:border-b-2 focus:border-[var(--color-accent)] pb-1"
        [value]="tmpl.name" placeholder="Tiêu đề biểu mẫu" (input)="updateTemplateName($any($event.target).value)" />

      <input
        class="m-0 mt-3 w-full border-0 border-b border-transparent bg-transparent p-0 text-sm text-[var(--color-text-secondary)] outline-none transition hover:border-[var(--color-border)] focus:border-b-2 focus:border-[var(--color-accent)] pb-1"
        [value]="tmpl.description" placeholder="Mô tả biểu mẫu"
        (input)="updateTemplateDescription($any($event.target).value)" />
    </div>
  </div>

  <!-- Question cards list -->
  <div class="relative grid gap-3">
    @for (field of tmpl.fields; track field.id; let i = $index) {
    <app-form-config-field-card [field]="field" [templateId]="tmpl.id" [isActive]="activeFieldId === field.id"
      [fieldTypeOptions]="fieldTypeOptions" (activated)="activeFieldId = $event">
    </app-form-config-field-card>
    } @empty {
    <div
      class="rounded-[var(--radius-lg)] border border-[var(--color-border)] bg-white py-12 text-center text-sm text-[var(--color-text-tertiary)] shadow-sm">
      <div
        class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-[var(--color-surface-hover)] text-2xl">
        📝</div>
      Chưa có câu hỏi nào.<br> Nhấn <strong>Thêm câu hỏi (+)</strong> ở thanh công cụ bên phải để bắt đầu.
    </div>
    }
  </div>

  } @else {
  <div
    class="rounded-[var(--radius-lg)] border border-[var(--color-border)] bg-[var(--color-surface)] p-10 text-center text-sm text-[var(--color-text-tertiary)] shadow-sm">
    Không tìm thấy mẫu biểu mẫu nào.
  </div>
  }
</div>

<!-- Modal: Save Form Name Popup -->
@if (isSaveModalOpen()) {
<app-ui-modal title="Lưu biểu mẫu" maxWidthClass="max-w-[420px]" (closed)="closeSaveModal()">

  <div class="mb-4">
    <label class="mb-1.5 block text-sm font-medium text-[#202124]">Tên biểu mẫu</label>
    <input type="text" [value]="saveFormName()" (input)="saveFormName.set($any($event.target).value)"
      class="w-full rounded-[var(--radius-md)] border border-[#dadce0] px-3 py-2 text-sm text-[#202124] outline-none transition focus:border-[#673ab7] focus:ring-1 focus:ring-[#673ab7]" />
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button (click)="closeSaveModal()"
      class="rounded-[var(--radius-md)] px-5 py-2 text-sm font-medium text-[#5f6368] transition hover:bg-black/5">Hủy</button>
    <button (click)="confirmSave()"
      class="rounded-[var(--radius-md)] bg-[#673ab7] px-5 py-2 text-sm font-medium text-white transition hover:bg-[#5e35b1]">Lưu
      lại</button>
  </div>
</app-ui-modal>
}
