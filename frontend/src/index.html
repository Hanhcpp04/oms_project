<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>OMS — Order Management System</title>
  <meta name="description" content="Hệ thống quản lý đơn hàng OMS — theo dõi, điều phối và vận hành đơn hàng hiệu quả.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- Prevent theme flash before Angular boots -->
  <script>
    (function() {
      var t = localStorage.getItem('oms-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
