# ==================== PROD Profile ====================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:oms_db}?useSSL=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# ==================== JWT ====================
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  messenger:
    verify-token: ${MESSENGER_VERIFY_TOKEN:}
    default-page-id: ${MESSENGER_PAGE_ID:}
    default-shop-id: ${MESSENGER_DEFAULT_SHOP_ID:0}
    default-page-access-token: ${MESSENGER_PAGE_ACCESS_TOKEN:}
  public:
    frontend-base-url: ${PUBLIC_FRONTEND_BASE_URL:https://yourdomain.com}
    tracking-secret: ${PUBLIC_ORDER_TRACKING_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:https://yourdomain.com}

# ==================== Logging ====================
logging:
  level:
    com.oms: INFO
    org.hibernate.SQL: WARN
