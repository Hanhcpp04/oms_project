# ==================== Application Config ====================
spring:
  application:
    name: oms-backend
  profiles:
    active: dev

  # ==================== JPA ====================
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  # ==================== Jackson ====================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ==================== Server ====================
server:
  port: 8080
  servlet:
    context-path: /

# ==================== Swagger ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

app:
  security:
    rate-limit:
      enabled: true
      window-seconds: 60
      auth-max-requests: 20
      public-max-requests: 120
  upload:
    storage: local
    dir: uploads
