# ==================== Application Config ====================
spring:
  application:
    name: oms-backend
  profiles:
    active: dev

  # ==================== JPA ====================
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ==================== Jackson ====================
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ==================== Server ====================
server:
  port: 8080
  servlet:
    context-path: /

# ==================== Swagger ====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
